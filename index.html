function showHabitModal(id){const modal=document.getElementById('habitModal');const h=id?db.habits.find(x=>x.id===id):null;if(id&&!h)return;document.getElementById('habitModalTitle').textContent=h?'تعديل العادة':'إضافة عادة';document.getElementById('habitId').value=h?.id||'';document.getElementById('habitName').value=h?.name||'';document.getElementById('habitTime').value=h?.time||'09:00';document.getElementById('habitCategory').value=h?.category||'personal';document.querySelectorAll('input[name="habitDays"]').forEach(c=>c.checked?(c.checked=false):null);const days=h?.days||[0,1,2,3,4,5,6];document.querySelectorAll('input[name="habitDays"]').forEach(c=>c.checked=days.includes(+c.value));modal.classList.add('open');setTimeout(()=>document.getElementById('habitName').focus(),50)}function hideHabitModal(){document.getElementById('habitModal').classList.remove('open')}function saveHabitFromForm(e){e.preventDefault();const id=document.getElementById('habitId').value,name=document.getElementById('habitName').value.trim(),time=document.getElementById('habitTime').value||'09:00',days=[...document.querySelectorAll('input[name="habitDays"]:checked')].map(c=>+c.value),category=document.getElementById('habitCategory').value;if(!name){toast('اكتب اسم العادة');return}if(!days.length){toast('اختار يوم واحد على الأقل لتكرار العادة');return}const existing=id?db.habits.find(x=>x.id===id):null;if(existing)Object.assign(existing,{name,time,days,category});else db.habits.push({id:uid(),name,time,days,category,createdAt:Date.now()});save();hideHabitModal();render();toast(existing?'تم تعديل العادة':'تمت إضافة العادة إلى جدول اليوم')}
function renderHabits(){let d=selectedDate,day=new Date(d+'T12:00:00').getDay();let habits=db.habits.filter(h=>!h.days||h.days.includes(day));return `<section class="card"><div class="section-title"><h2>العادات</h2><div class="date-nav"><button class="secondary small" data-day="-1">‹</button><input type="date" id="selectedDate" value="${d}"><button class="secondary small" data-day="1">›</button></div></div><div class="muted tiny">العادات تظهر في جدول اليوم حسب الوقت المحدد، ويمكنك تسجيل إنجازها أو تعديلها أو حذفها.</div><div class="divider"></div>${habits.map(h=>{let logs=db.habitLogs[h.id]||{},checked=habitIsDone(logs[d]);let streak=0,cur=d;while(habitIsDone(logs[cur])){streak++;cur=addDays(cur,-1)}return `<div class="habit"><input type="checkbox" data-habit="${h.id}" ${checked?'checked':''}><div class="habit-name"><strong>${esc(h.name)}</strong><div class="caption">${CAT[h.category]||'شخصي'} · الساعة ${esc(h.time||'09:00')} · ${(h.days||[0,1,2,3,4,5,6]).map(x=>DAYS[x]).join('، ')}</div></div><span class="streak">🔥 ${streak} يوم</span><button class="secondary small" data-edit-habit="${h.id}">تعديل</button><button class="ghost small" data-delete-habit="${h.id}">حذف</button></div>`}).join('')||'<div class="empty">لا توجد عادات في هذا اليوم.</div>'}<div class="divider"></div><button data-add-habit="1">＋ إضافة عادة بوقت</button></section><section class="card" style="margin-top:12px"><h3>متابعة العادات: أسبوع / شهر / سنة</h3>${db.habits.map(h=>{const now=todayISO(),dtNow=new Date(now+'T12:00:00'),weekStart=addDays(now,-dtNow.getDay()),weekEnd=addDays(weekStart,6),monthStart=now.slice(0,7)+'-01',monthEnd=addDays(shiftMonth(monthStart,1),-1),yearStart=now.slice(0,4)+'-01-01',yearEnd=now.slice(0,4)+'-12-31',w=habitPeriodCount(h,weekStart,weekEnd),m=habitPeriodCount(h,monthStart,monthEnd),y=habitPeriodCount(h,yearStart,yearEnd);return `<div class="goal"><strong>${esc(h.name)}</strong><div class="stats" style="margin-top:8px;margin-bottom:0"><div class="stat"><b>${w.done}/${w.planned}</b><span>هذا الأسبوع</span></div><div class="stat"><b>${m.done}/${m.planned}</b><span>هذا الشهر</span></div><div class="stat"><b>${y.done}/${y.planned}</b><span>هذه السنة</span></div></div></div>`}).join('')||'<div class="empty">أضف عادة لبدء تسجيل الإنجاز.</div>'}</section>`}
function renderFocus(){let opts=activeTasks().filter(t=>t.status!=='done').map(t=>`<option value="${t.id}" ${focus.taskId===t.id?'selected':''}>${esc(t.title)}</option>`).join('');return `<section class="card"><div class="section-title"><h2>مؤقت التركيز</h2><span class="pill">Pomodoro</span></div><label>اربط الجلسة بمهمة</label><select id="focusTask"><option value="">جلسة عامة</option>${opts}</select><div class="matrix" style="margin-top:12px"><div class="quad" style="text-align:center"><div class="muted">${focus.mode==='work'?'تركيز':'استراحة'}</div><div id="focusClock" style="font-size:3rem;font-weight:800;direction:ltr">${String(Math.floor(focus.remaining/60)).padStart(2,'0')}:${String(focus.remaining%60).padStart(2,'0')}</div><div class="bar" style="justify-content:center"><button id="focusStart">${focus.running?'إيقاف مؤقت':'ابدأ'}</button><button class="secondary" id="focusReset">إعادة</button></div></div><div class="quad"><h3>إعداد الجلسة</h3><label>تركيز (دقيقة)</label><input id="focusWork" type="number" min="5" max="120" value="${focus.mode==='work'?Math.round(focus.total/60):25}"><label style="margin-top:8px">استراحة (دقيقة)</label><input id="focusBreak" type="number" min="1" max="60" value="5"><button class="secondary" style="margin-top:8px" id="applyFocus">تطبيق</button></div></div><div class="divider"></div><h3>سجل اليوم</h3><div class="stats"><div class="stat"><b>${activeTasks().filter(t=>t.date===todayISO()).reduce((s,t)=>s+(t.actualMinutes||0),0)}</b><span>دقائق فعلية مسجلة</span></div><div class="stat"><b>${db.reviews[todayISO()]?.focusSessions||0}</b><span>جلسات تركيز</span></div></div><div class="caption">عند انتهاء جلسة التركيز تُضاف دقائقها الفعلية للمهمة المرتبطة. التذكيرات لا تعمل بعد إغلاق صفحة الويب.</div></section>`}
function renderEvening(){let ts=tasksOn(selectedDate),done=ts.filter(t=>t.status==='done').length;let r=db.reviews[selectedDate]||{};return `<section class="card"><div class="section-title"><h2>التقفيل المسائي</h2><span class="pill">${fmtDate(selectedDate)}</span></div><div class="stats"><div class="stat"><b>${ts.length}</b><span>مهام اليوم</span></div><div class="stat"><b>${done}</b><span>تم إنجازها</span></div><div class="stat"><b>${ts.length-done}</b><span>باقية</span></div><div class="stat"><b>${pct(ts)}%</b><span>الإنجاز</span></div></div><h3>راجع الحالات</h3>${ts.filter(t=>t.status!=='done').map(t=>taskCard(t)).join('')||'<div class="empty">أحسنت، لا توجد مهام غير منجزة لهذا اليوم.</div>'}<div class="bar"><button id="carryEvening">رحّل كل الباقي إلى غدًا</button><button class="secondary" id="leaveDeferred">علّم الباقي مؤجلًا</button></div><div class="divider"></div><label>ماذا أنجزت؟</label><textarea id="reviewWins" placeholder="ما الذي سار جيدًا؟">${esc(r.wins||'')}</textarea><label style="margin-top:8px">ماذا ضيّعت أو عطّلني؟</label><textarea id="reviewLosses" placeholder="ما الذي أريد تغييره غدًا؟">${esc(r.losses||'')}</textarea><button id="saveEvening" style="margin-top:10px">حفظ التقفيل</button></section>`}
function renderReview(){let base=addDays(todayISO(),-new Date(todayISO()+'T12:00:00').getDay());let week=[];for(let i=0;i<7;i++)week.push(...tasksOn(addDays(base,i)));let cats=Object.keys(CAT).map(c=>({c,m:totalMinutes(week.filter(t=>t.category===c))}));let deferred=activeTasks().filter(t=>t.deferCount).sort((a,b)=>b.deferCount-a.deferCount).slice(0,5);let r=db.reviews[base]||{};return `<section class="card"><div class="section-title"><h2>المراجعة الأسبوعية</h2><span class="pill">من ${fmtDate(base)} إلى ${fmtDate(addDays(base,6))}</span></div><div class="stats"><div class="stat"><b>${week.length}</b><span>المهام</span></div><div class="stat"><b>${pct(week)}%</b><span>الإنجاز</span></div><div class="stat"><b>${(totalMinutes(week)/60).toFixed(1)}</b><span>ساعات مخططة</span></div><div class="stat"><b>${(week.reduce((s,t)=>s+(t.actualMinutes||0),0)/60).toFixed(1)}</b><span>ساعات فعلية</span></div></div><h3>الساعات حسب التصنيف</h3>${cats.map(x=>`<div style="margin:9px 0"><div class="bar" style="justify-content:space-between"><span>${CAT[x.c]}</span><b>${(x.m/60).toFixed(1)} س</b></div><div class="progress"><i style="width:${totalMinutes(week)?x.m/totalMinutes(week)*100:0}%"></i></div></div>`).join('')}<div class="divider"></div><h3>الأكثر تأجيلًا</h3>${deferred.map(t=>`<div class="bar" style="margin:6px 0"><span>${esc(t.title)}</span><span class="pill red">${t.deferCount} مرات</span></div>`).join('')||'<div class="muted tiny">لا توجد تأجيلات مسجلة بعد.</div>'}<div class="divider"></div><label>ما الذي نجح؟</label><textarea id="reviewWeekWins">${esc(r.weekWins||'')}</textarea><label style="margin-top:8px">ما الذي تعطّل؟</label><textarea id="reviewWeekBlockers">${esc(r.weekBlockers||'')}</textarea><h3 style="margin-top:12px">3 أهداف للأسبوع القادم</h3>${[0,1,2].map(i=>`<label>الهدف ${i+1}</label><input id="weekGoal${i}" value="${esc((r.nextGoals||[])[i]||'')}" placeholder="هدف واضح قابل للقياس">`).join('')}<button id="saveWeekly" style="margin-top:12px">حفظ المراجعة</button function renderSettings(){return `<section class="card"><h2>الإعدادات</h2><div class="settings-row"><div><strong>المظهر</strong><div class="caption">فاتح أو داكن</div></div><button class="secondary" id="toggleTheme">${db.settings.theme==='dark'?'داكن':'فاتح'}</button></div><div class="settings-row"><div><strong>بداية اليوم</strong><div class="caption">يبدأ يومك من 00:00 حسب اختيارك</div></div><input type="time" id="dayStart" value="${db.settings.dayStart||'00:00'}"></div><div class="settings-row"><div><strong>بداية النوم</strong></div><input type="time" id="sleepStart" value="${db.settings.sleepStart}"></div><div class="settings-row"><div><strong>نهاية النوم</strong></div><input type="time" id="sleepEnd" value="${db.settings.sleepEnd}"></div><div class="settings-row"><div><strong>الساعات المتاحة يوميًا</strong><div class="caption">لحساب تحذير 70/30</div></div><input type="number" id="availableHours" min="1" max="24" value="${db.settings.availableHours}"></div><h3 style="margin-top:16px">مراسي الصلاة — قابلة للتعديل يدويًا</h3>${Object.entries(db.settings.prayers||{}).map(([k,v])=>`<div class="settings-row"><strong>${k}</strong><input type="time" data-prayer="${k}" value="${v}"></div>`).join('')}<div class="divider"></div><div class="bar"><button id="saveSettings">حفظ الإعدادات</button><button class="secondary" id="exportJSON">تصدير نسخة JSON</button><button class="secondary" id="exportICS">تصدير تقويم ICS</button><label class="secondary" style="padding:10px 12px;border-radius:12px;cursor:pointer">استيراد JSON<input type="file" id="importJSON" accept="application/json,.json" hidden></label></div><p class="caption">يُحفظ العمل محليًا دائمًا. بعد إعداد Supabase وتسجيل الدخول، تتزامن البيانات بين أجهزتك. لا تمسح بيانات المتصفح قبل تصدير نسخة احتياطية. تنبيهات الصفحة عند إغلاقها غير مضمونة؛ استخدم ملف ICS مع تقويم الهاتف.</p><div class="divider"></div><h3>بيانات البداية</h3><p class="tiny muted">المستخدم الجديد يبدأ بقوائم فارغة؛ أضف مهامك وعاداتك بنفسك. بياناتك القديمة function showModal(id){document.getElementById('taskModal').classList.add('open');document.getElementById('modalTitle').textContent=id?'تعديل المهمة':'مهمة جديدة';let t=id?db.tasks.find(x=>x.id===id):null;document.getElementById('taskId').value=t?.id||'';document.getElementById('taskTitle').value=t?.title||'';document.getElementById('taskDate').value=t?.date||selectedDate;document.getElementById('taskScope').value=t?.scope||((view==='periods')?(periodMode==='monthly'?'month':periodMode==='weekly'?'week':'day'):(view==='week'?'week':'day'));document.getElementById('taskStart').value=hm(t?.start??540);document.getElementById('taskEnd').value=hm(((t?.start??540)+(t?.duration||60))%1440);document.getElementById('taskPriority').value=t?.priority||'medium';document.getElementById('taskStatus').value=t?.status||'todo';document.getElementById('taskCategory').value=t?.category||'personal';document.getElementById('taskTags').value=(t?.tags||[]).join(', ');document.getElementById('taskRepeat').value=t?.repeat?.type||'none';document.getElementById('taskRepeatDays').value=(t?.repeat?.days||[]).join(',');document.getElementById('taskGoal').innerHTML='<option value="">بدون هدف</option>'+db.goals.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');document.getElementById('taskGoal').value=t?.goalId||'';document.getElementById('taskActual').value=t?.actualMinutes||0;document.getElementById('taskSubtasks').value=(t?.subtasks||[]).join('\n');document.getElementById('taskNotes').value=t?.notes||'';document.getElementById('repeatDaysField').classList.toggle('hidden',!['custom','weekly'].includes(document.getElementById('taskRepeat').value));setTimeout(()=>document.getElementById('taskTitle').focus(),100)}function hideModal(){document.getElementById('taskModal').classList.remove('open')}
function saveTaskFromForm(e){e.preventDefault();let id=document.getElementById('taskId').value,t=id?db.tasks.find(x=>x.id===id):null;let rep=document.getElementById('taskRepeat').value;let days=document.getElementById('taskRepeatDays').value.split(',').map(x=>parseInt(x.trim(),10)).filter(x=>x>=0&&x<=6);let obj={id:id||uid(),title:document.getElementById('taskTitle').value.trim(),date:document.getElementById('taskDate').value,scope:document.getElementById('taskScope').value||'day',start:mins(document.getElementById('taskStart').value),duration:(()=>{const a=mins(document.getElementById('taskStart').value),b=mins(document.getElementById('taskEnd').value);return Math.max(5,Math.min(1440,(b-a+1440)%1440||60))})(),priority:document.getElementById('taskPriority').value,status:document.getElementById('taskStatus').value,category:document.getElementById('taskCategory').value,tags:document.getElementById('taskTags').value.split(',').map(x=>x.trim()).filter(Boolean),subtasks:document.getElementById('taskSubtasks').value.split('\n').map(x=>x.trim()).filter(Boolean),notes:document.getElementById('taskNotes').value.trim(),repeat:rep==='none'?null:{type:rep,days:days.length?days:[new Date(document.getElementById('taskDate').value+'T12:00:00').getDay()]},goalId:document.getElementById('taskGoal').value,actualMinutes:+document.getElementById('taskActual').value||0,deferCount:t?.deferCount||0,createdAt:t?.createdAt||Date.now(),completedAt:document.getElementById('taskStatus').value==='done'?(t?.completedAt||Date.now()):null,deletedAt:null,quadrant:t?.quadrant||'',source:t?.source||'manual'};if(!obj.title){toast('اكتب عنوان المهمة أولًا');return}if(t)Object.assign(t,obj);else db.tasks.push(obj);selectedDate=obj.date;save();hideModal();render();toast(t?'تم تحديث المهمة':'تمت إضافة المهمة')}
function toggleTask(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;t.status=t.status==='done'?'todo':'done';t.completedAt=t.status==='done'?Date.now():null;save();render()}
function deferTask(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;let suggested=addDays(t.date,1);let val=prompt('إلى أي تاريخ تريد التأجيل؟ اكتب غدًا أو بعد غد أو YYYY-MM-DD',suggested);if(val===null)return;val=val.trim();let target=val==='غدًا'||val==='غدا'?addDays(todayISO(),1):val==='بعد غد'||val==='بعد غدًا'?addDays(todayISO(),2):val;if(!/^\d{4}-\d{2}-\d{2}$/.test(target)){toast('اكتب تاريخًا صحيحًا مثل 2026-10-12');return}t.date=target;t.status='deferred';t.deferCount=(t.deferCount||0)+1;selectedDate=target;save();render();if(t.deferCount>=2)toast(`تأجلت «${t.title}» ${t.deferCount} مرة. اختر: تقسيم أو تفويض أو حذف.`,{label:'اختيار حل',fn:()=>{let choice=prompt('اكتب: تقسيم أو تفويض أو حذف');if(choice==='تقسيم'){let sub=prompt('اكتب عنوان المهمة الأصغر');if(sub){t.subtasks=[...(t.subtasks||[]),sub];save();render()}}else if(choice==='تفويض'){let who=prompt('لمن ستفوّض المهمة؟');if(who){t.notes=(t.notes?'\n':'')+'مفوّضة إلى: '+who;save();render()}}else if(choice==='حذف')deleteTask(t.id)}});else toast('تم تأجيل المهمة ونقلها إلى '+fmtDate(target))}
function deleteTask(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;let copy=clone(t);t.deletedAt=Date.now();db.trash.push(copy);save();render();toast('حُذفت المهمة. يمكنك التراجع الآن.',{label:'تراجع',fn:()=>{let live=db.tasks.find(x=>x.id===id);if(live)live.deletedAt=null;db.trash=db.trash.filter(x=>x.id!==id);save();render()}})}function moveToday(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;t.date=selectedDate;t.status=t.status==='done'?'todo':t.status;save();render();toast('نُقلت المهمة إلى '+fmtDate(selectedDate))}function carryAll(){let late=activeTasks().filter(t=>t.date<selectedDate&&t.status!=='done');late.forEach(t=>{t.date=selectedDate;if(t.status==='deferred')t.status='todo'});save();render();toast(`تم نقل ${late.length} مهمة لليوم`)}
function parseQuick(raw){let text=raw.trim(),date=todayISO(),start=mins('09:00'),priority='medium',category='personal';if(/بعد غد/.test(text)){date=addDays(date,2);text=text.replace(/بعد غد(ًا)?/g,'')}else if(/بكره|بكرة|غدا|غدًا/.test(text)){date=addDays(date,1);text=text.replace(/بكره|بكرة|غدا|غدًا/g,'')}else if(/النهارده|اليوم/.test(text)){text=text.replace(/النهارده|اليوم/g,'')}let dateMatch=text.match(/(20\d{2}-\d{2}-\d{2})/);if(dateMatch){date=dateMatch[1];text=text.replace(dateMatch[0],'')}let tm=text.match(/(\d{1,2})(?::(\d{2}))?\s*(ص|صباحًا?|م|مساءً?|am|pm)?/i);if(tm){let h=+tm[1],m=+(tm[2]||0),amp=(tm[3]||'').toLowerCase();if(['م','مساء','مساءً','pm'].includes(amp)&&h<12)h+=12;if(['ص','صباح','صباحًا','am'].includes(amp)&&h===12)h=0;if(h<=23&&m<=59)start=h*60+m;text=text.replace(tm[0],' ')}if(/!عالية|!high|!مهم/.test(text)){priority='high';text=text.replace(/!عالية|!high|!مهم/g,'')}else if(/!منخفضة|!low/.test(text)){priority='low';text=text.replace(/!منخفضة|!low/g,'')}else if(/!متوسطة/.test(text)){priority='medium';text=text.replace(/!متوسطة/g,'')}let tagMatch=[...text.matchAll(/#([\w\u0600-\u06FF]+)/g)].map(m=>m[1]);text=text.replace(/#[\w\u0600-\u06FF]+/g,' ');let catMap={'متجر':'store','محتوى':'content','تعلم':'learning','تعلّم':'learning','عبادة':'worship','صحة':'health','شخصي':'personal'};for(let [k,v] of Object.entries(catMap)){if(tagMatch.includes(k)){category=v;tagMatch=tagMatch.filter(x=>x!==k)}}return {title:text.replace(/\s+/g,' ').trim(),date,start,priority,category,tags:tagMatch,duration:60}}
function addQuick(){let raw=document.getElementById('quickInput').value;if(!raw.trim())return;let p=parseQuick(raw);if(!p.title){toast('لم أستطع فهم عنوان المهمة. اكتب وصفًا بعد الوقت.');return}db.tasks.push({id:uid(),...p,scope:(view==='periods'?(periodMode==='monthly'?'month':periodMode==='weekly'?'week':'day'):(view==='week'?'week':'day')),status:'todo',subtasks:[],notes:'',repeat:null,goalId:'',actualMinutes:0,deferCount:0,createdAt:Date.now(),deletedAt:null,source:'quick'});selectedDate=p.date;document.getElementById('quickInput').value='';save();render();toast('تمت إضافة: '+p.title)}
function exportJSON(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'وقتي'},null,2)],{type:'application/json'});download(blob,`waqti-backup-${todayISO()}.json`)}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportICS(){let ts=activeTasks().filter(t=>t.status!=='done');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Waqti//AR','CALSCALE:GREGORIAN'];for(let t of ts){let d=t.date.replace(/-/g,'');let start=+t.start||0,end=start+(+t.duration||60);let dt=(m)=>`${d}T${String(Math.floor(m/60)%24).padStart(2,'0')}${String(m%60).padStart(2,'0')}00`;lines.push('BEGIN:VEVENT',`UID:${t.id}@waqti`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART:${dt(start)}`,`DTEND:${dt(end%1440)}`,`SUMMARY:${String(t.title).replace(/[,;\\]/g,' ')}`,`DESCRIPTION:${String(t.notes||'').replace(/[,;\\]/g,' ')}`,'END:VEVENT')}lines.push('END:VCALENDAR');download(new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),`waqti-${todayISO()}.ics`)}
function importJSON(file){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.tasks)||!Array.isArray(x.habits))throw Error();if(!confirm('سيستبدل الاستيراد بيانات وقتي الحالية. هل صدّرت نسخة احتياطية؟'))return;db=x;save();render();toast('تم استيراد النسخة الاحتياطية')}catch(e){toast('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(file)}
function renderSmart(which){let all=activeTasks(),ts=which==='late'?all.filter(t=>t.date<todayISO()&&t.status!=='done'):which==='deferred'?all.filter(t=>t.status==='deferred'||t.deferCount):which==='short'?all.filter(t=>t.duration<15&&t.status!=='done'):which==='night'?all.filter(t=>(t.start<300||t.start>=1320)&&t.status!=='done'):which==='critical'?all.filter(t=>t.date===todayISO()&&t.priority==='high'&&t.status!=='done'):all;return `<div class="bar" style="margin-bottom:10px">${[['critical','اليوم الحرج'],['late','المتأخر'],['deferred','المؤجل'],['short','أقل من 15 دقيقة'],['night','عمق الليل'],['all','كل المهام']].map(([k,l])=>`<button class="secondary small" data-smart="${k}">${l}</button>`).join('')}</div>${ts.map(t=>taskCard(t)).join('')||'<div class="empty">لا توجد مهام في هذه القائمة.</div>'}`}

function startFocus(){
 focus.taskId=document.getElementById('focusTask').value;
 if(focus.running){focus.running=false;clearInterval(focusInterval);render();return}
 focus.running=true;focus.last=Date.now();
 focusInterval=setInterval(()=>{
  if(!focus.running)return;
  const now=Date.now(),elapsed=Math.floor((now-focus.last)/1000);
  if(elapsed>0){focus.remaining=Math.max(0,focus.remaining-elapsed);focus.last=now;const c=document.getElementById('focusClock');if(c)c.textContent=String(Math.floor(focus.remaining/60)).padStart(2,'0')+':'+String(focus.remaining%60).padStart(2,'0');
   if(focus.remaining<=0){focus.running=false;clearInterval(focusInterval);
    if(focus.mode==='work'){const t=db.tasks.find(x=>x.id===focus.taskId);if(t)t.actualMinutes=(t.actualMinutes||0)+Math.round(focus.total/60);db.reviews[todayISO()]={...(db.reviews[todayISO()]||{}),focusSessions:(db.reviews[todayISO()]?.focusSessions||0)+1};focus.mode='break';focus.total=(+(document.getElementById('focusBreak')?.value||5))*60;focus.remaining=focus.total;}
    toast('انتهت الجلسة');save();render();
   }
  }
 },1000);render();
}

function initSupabase(){if(!CLOUD_CONFIGURED()){setSyncStatus('حفظ محلي');return}if(!window.supabase?.createClient){setSyncStatus('تعذّر تحميل خدمة الحساب');return}supabaseClient=window.supabase.createClient(window.WAQTI_SUPABASE_URL,window.WAQTI_SUPABASE_ANON_KEY);supabaseClient.auth.onAuthStateChange((event,session)=>{const nextUser=session?.user||null;const changed=nextUser?.id!==authUser?.id;authUser=nextUser;if(authUser){refreshAccountUI();if(changed||!cloudLoaded){setSyncStatus('جارٍ تحميل الحساب');setTimeout(()=>loadAccountData(authUser),0)}}else{cloudLoaded=false;cloudUserId='';authLoadingUserId='';if(cloudChannel){supabaseClient.removeChannel(cloudChannel);cloudChannel=null}setSyncStatus('حفظ محلي');refreshAccountUI()}});supabaseClient.auth.getSession().then(({data,error})=>{if(error){setSyncStatus('خطأ في الحساب');return}if(data.session?.user){authUser=data.session.user;refreshAccountUI();if(!cloudLoaded||cloudUserId!==authUser.id)loadAccountData(authUser)}else{refreshAccountUI();setSyncStatus('غير مسجّل')}}).catch(()=>setSyncStatus('تعذّر الاتصال'))}
async function signInEmail(){if(!supabaseClient){toast('إعداد Supabase مطلوب أولًا؛ راجع ملف README_AR.md');return}const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||!password){toast('اكتب البريد الإلكتروني وكلمة المرور');return}const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)toast('تعذّر تسجيل الدخول: '+error.message);else toast('تم تسجيل الدخول؛ جارٍ تحميل البيانات')}
async function signUpEmail(){if(!supabaseClient){toast('إعداد Supabase مطلوب أولًا؛ راجع ملف README_AR.md');return}const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||password.length<6){toast('اكتب بريدًا صحيحًا وكلمة مرور من 6 أحرف على الأقل');return}const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)toast('تعذّر إنشاء الحساب: '+error.message);else if(data.session)toast('تم إنشاء الحساب');else toast('راجع بريدك لتأكيد الحساب ثم سجّل الدخول')}
async function signInGoogle(){if(!supabaseClient){toast('إعداد Supabase مطلوب أولًا؛ راجع ملف README_AR.md');return}const redirectTo=location.origin+location.pathname;const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo}});if(error)toast('تعذّر تسجيل الدخول عبر Google: '+error.message)}
async function signOutAccount(){if(!supabaseClient)return;const {error}=await supabaseClient.auth.signOut();if(error)toast('تعذّر تسجيل الخروج: '+error.message);else{authUser=null;cloudLoaded=false;cloudUserId='';setSyncStatus('حفظ محلي');refreshAccountUI();document.getElementById('accountModal').classList.remove('open');toast('تم تسجيل الخروج. بيانات الجهاز المحلية ما زالت محفوظة')}}
async function loadAccountData(user){if(!supabaseClient||!user||authLoadingUserId===user.id)return;authLoadingUserId=user.id;cloudLoaded=false;try{const {data,error}=await supabaseClient.from('waqti_user_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;const localSnapshot=localStorage.getItem('waqti-v1');if(localSnapshot)localStorage.setItem('waqti-local-backup-'+Date.now(),localSnapshot);if(data?.data&&typeof data.data==='object'){let localData={};try{localData=JSON.parse(localSnapshot||'{}')}catch(e){}db=data.data;db.habitLogs=mergeHabitLogs(localData.habitLogs,db.habitLogs);cloudUserId=user.id;localStorage.setItem('waqti-v1',JSON.stringify(db));lastCloudJson=JSON.stringify(db);cloudLoaded=true;render();setSyncStatus('متزامن ✓');toast('تم تحميل بيانات حسابك من السحابة')}else{const localHasData=(db.tasks?.length||db.habits?.length||db.goals?.length);if(localHasData){const upload=confirm('هذا الحساب جديد ولا توجد له بيانات سحابية. هل تريد رفع بيانات هذا الجهاز؟ قد تحتوي على مهام قديمة مستوردة من الإكسيل. اضغط إلغاء لبدء حساب فارغ؛ تم حفظ نسخة محلية احتياطية تلقائيًا.');if(!upload)db=emptyData()}localStorage.setItem('waqti-v1',JSON.stringify(db));cloudLoaded=true;cloudUserId=user.id;await syncCloudNow();render();toast('تم تجهيز بيانات الحساب')}subscribeCloud(user.id)}catch(e){cloudLoaded=false;cloudUserId='';setSyncStatus('المزامنة بها مشكلة');toast('تعذّر تحميل بيانات الحساب. تأكد من تنفيذ SQL في README_AR.md. '+(e.message||''))}finally{authLoadingUserId='';refreshAccountUI()}}
function scheduleCloudSync(){if(!supabaseClient||!authUser||!cloudLoaded||applyingRemote)return;clearTimeout(cloudTimer);setSyncStatus('حفظ التغييرات…');cloudTimer=setTimeout(()=>syncCloudNow(),900)}
async function syncCloudNow(){if(!supabaseClient||!authUser||!cloudLoaded||cloudBusy)return;cloudBusy=true;try{const snapshot=clone(db),json=JSON.stringify(snapshot);const {error}=await supabaseClient.from('waqti_user_data').upsert({user_id:authUser.id,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;lastCloudJson=json;setSyncStatus('متزامن ✓');if(JSON.stringify(db)!==json)scheduleCloudSync()}catch(e){setSyncStatus('غير متزامن');toast('لم تنجح المزامنة. بياناتك ما زالت محفوظة على هذا الجهاز. '+(e.message||''))}finally{cloudBusy=false;refreshAccountUI()}}
function subscribeCloud(userId){if(!supabaseClient)return;if(cloudChannel)supabaseClient.removeChannel(cloudChannel);cloudChannel=supabaseClient.channel('waqti-user-'+userId).on('postgres_changes',{event:'*',schema:'public',table:'waqti_user_data',filter:'user_id=eq.'+userId},payload=>{const remote=payload.new?.data;if(!remote||!cloudLoaded||cloudTimer||cloudBusy)return;const json=JSON.stringify(remote);if(json===JSON.stringify(db)||json===lastCloudJson)return;localStorage.setItem('waqti-local-backup-'+Date.now(),JSON.stringify(db));applyingRemote=true;const localLogs=db.habitLogs;db=remote;db.habitLogs=mergeHabitLogs(localLogs,db.habitLogs);localStorage.setItem('waqti-v1',JSON.stringify(db));lastCloudJson=json;render();applyingRemote=false;setSyncStatus('تمت المزامنة ✓');toast('وصلت تحديثات من جهازك الآخر')}).subscribe();}
document.addEventListener('click',handleClick);document.getElementById('taskForm').addEventListener('submit',saveTaskFromForm);document.getElementById('habitForm').addEventListener('submit',saveHabitFromForm);document.getElementById('quickInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addQuick()}});document.getElementById('importJSON').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''});document.getElementById('view').addEventListener('change',e=>{if(e.target.id==='selectedDate'){selectedDate=e.target.value||todayISO();render()}else if(e.target.dataset.habit){let h=db.habits.find(x=>x.id===e.target.dataset.habit);if(!h)return;if(!db.habitLogs||typeof db.habitLogs!=='object')db.habitLogs={};if(!db.habitLogs[h.id]||typeof db.habitLogs[h.id]!=='object')db.habitLogs[h.id]={};db.habitLogs[h.id][selectedDate]={done:!!e.target.checked,updatedAt:Date.now()};save();render();toast(e.target.checked?'اتحفظ إنجاز العادة لليوم':'اتشال تسجيل إنجاز العادة لليوم')}else if(e.target.id==='focusTask')focus.taskId=e.target.value;else if(e.target.id==='taskRepeat'){document.getElementById('repeatDaysField').classList.toggle('hidden',!['custom','weekly'].includes(e.target.value))}});document.getElementById('view').addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag-id]');if(el)e.dataTransfer.setData('text/plain',el.dataset.dragId)});document.getElementById('view').addEventListener('dragover',e=>{let slot=e.target.closest('[data-hour]');if(slot){e.preventDefault();slot.classList.add('drop')}});document.getElementById('view').addEventListener('dragleave',e=>{let slot=e.target.closest('[data-hour]');if(slot)slot.classList.remove('drop')});document.getElementById('view').addEventListener('drop',e=>{let slot=e.target.closest('[data-hour]');if(!slot)return;e.preventDefault();let id=e.dataTransfer.getData('text/plain'),t=db.tasks.find(x=>x.id===id);if(t){t.date=slot.dataset.date;t.start=+slot.dataset.hour*60;selectedDate=t.date;save();render();toast('تم تغيير وقت المهمة')}});document.getElementById('mainNav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render()}});document.getElementById('bottomNav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render()}});
// PWA offline cache; the page remains usable as a plain HTML file too.
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
// Fresh installs start empty; saved local data is preserved.
render();
initSupabase();
</script></body></html>

function taskCard(t,opts={}){let start=hm(t.start||0),end=hm(((+t.start||0)+(+t.duration||60))%1440);return `<article class="task ${esc(t.priority||'medium')} ${t.status==='done'?'done':''}" data-id="${esc(t.id)}"><div class="task-head"><button class="check" aria-label="تغيير حالة المهمة" data-action="toggle" data-id="${esc(t.id)}">${t.status==='done'?'✓':''}</button><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="meta"><span>◷ ${start}–${end}</span><span class="pill ${priorityColor(t.priority)}">${PRIOR[t.priority]||'متوسطة'}</span><span class="pill">${CAT[t.category]||'شخصي'}</span><span>${STATUS[t.status]||'لم يبدأ'}</span>${t.deferCount?`<span class="pill red">تأجلت ${t.deferCount} مرة</span>`:''}${t.repeat?`<span class="pill purple">↻ ${repeatLabel(t.repeat)}</span>`:''}</div>${t.notes?`<div class="tiny muted" style="margin-top:6px">${esc(t.notes)}</div>`:''}${t.subtasks?.length?`<div class="subtasks">${t.subtasks.map(s=>'◦ '+esc(s)).join('<br>')}</div>`:''}</div></div><div class="task-actions"><button class="secondary small" data-action="edit" data-id="${esc(t.id)}">تعديل</button><button class="secondary small" data-action="defer" data-id="${esc(t.id)}">تأجيل</button><button class="secondary small" data-action="moveToday" data-id="${esc(t.id)}">لليوم</button><button class="ghost small" data-action="delete" data-id="${esc(t.id)}">حذف</button></div></article>`}
function repeatLabel(r){if(!r)return'';return ({daily:'يومي',weekdays:'أيام العمل',weekly:'أسبوعي',monthly:'شهري',yearly:'سنوي',custom:'أيام محددة'})[r.type]||'متكرر'}
function ensureRepeats(){let now=todayISO(),weekEnd=addDays(now,6-new Date(now+'T12:00:00').getDay());for(const t of db.tasks.filter(t=>!t.deletedAt&&t.repeat&&!t.repeatGeneratedChild)){let r=t.repeat,base=t.date>now?t.date:now,horizon=(r.type==='yearly'||r.type==='monthly')?400:(r.type==='daily'?60:120);for(let i=1;i<=horizon;i++){let d=addDays(base,i);if(d<=weekEnd)continue;let weekday=new Date(d+'T12:00:00').getDay();let match=r.type==='daily'||(r.type==='weekdays'&&weekday>=1&&weekday<=5)||(r.type==='weekly'&&((r.days||[]).length?(r.days||[]).includes(weekday):weekday===new Date(t.date+'T12:00:00').getDay()))||(r.type==='custom'&&(r.days||[]).includes(weekday))||(r.type==='monthly'&&d.slice(8,10)===t.date.slice(8,10))||(r.type==='yearly'&&d.slice(5)===t.date.slice(5));if(!match)continue;let key=t.id+'@'+d;if(db.repeatGenerated[key]||db.tasks.some(x=>!x.deletedAt&&x.date===d&&x.title===t.title))continue;db.repeatGenerated[key]=true;db.tasks.push({...clone(t),id:uid(),date:d,status:'todo',deferCount:0,actualMinutes:0,completedAt:null,deletedAt:null,createdAt:Date.now(),repeatGeneratedChild:true,source:'repeat'});}}}
function dayStats(date){let ts=tasksOn(date);let available=Math.max(0,(+db.settings.availableHours||17)*60);let planned=totalMinutes(ts.filter(t=>t.status!=='done'));let high=ts.filter(t=>t.priority==='high'&&t.status!=='done').length;return {ts,done:doneCount(ts),pct:pct(ts),planned,available,ratio:available?planned/available:0,high}}
function render(){ensureRepeats();save();document.body.classList.toggle('dark',db.settings.theme==='dark');document.getElementById('themeBtn').textContent=db.settings.theme==='dark'?'☀':'☾';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let root=document.getElementById('view');const pages={today:renderToday,week:renderWeek,periods:renderPeriods,lists:renderLists,habits:renderHabits,focus:renderFocus,evening:renderEvening,review:renderReview,goals:renderGoals,settings:renderSettings};root.innerHTML=(pages[view]||renderToday)();}
function renderToday(){let st=dayStats(selectedDate),late=activeTasks().filter(t=>t.date<selectedDate&&!['done'].includes(t.status));let top=st.ts.filter(t=>t.status!=='done').sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-({high:0,medium:1,low:2}[b.priority]))).slice(0,3);let warn='';if(st.ratio>.7)warn+=`<div class="warn">⚠️ الخطة تشغل ${Math.round(st.ratio*100)}% من وقتك المتاح؛ قاعدة 70/30 تقترح ترك مساحة للطوارئ.</div>`;if(st.high>3)warn+=`<div class="warn">⚠️ لديك ${st.high} مهام عالية الأولوية؛ الحد المقترح 3 مهام فقط.</div>`;let hours='';for(let h=0;h<24;h++){let start=h*60,ts=st.ts.filter(t=>Math.floor((+t.start||0)/60)===h);let sleep=isSleep(selectedDate,start);hours+=`<div class="hour-label">${String(h).padStart(2,'0')}:00</div><div class="hour-slot ${sleep?'sleep':''}" data-hour="${h}" data-date="${selectedDate}">${ts.map(t=>`<div draggable="true" class="time-task ${t.priority} ${t.status==='done'?'done':''}" data-drag-id="${t.id}" data-id="${t.id}" title="اسحب لتغيير الوقت"><strong>${esc(t.title)}</strong><small>${hm(t.start)} · ${t.duration} د</small><div class="bar"><button class="ghost small" data-action="edit" data-id="${t.id}">✎</button><button class="ghost small" data-action="toggle" data-id="${t.id}">${t.status==='done'?'↶':'✓'}</button></div></div>`).join('')}</div>`}return `<div class="stats"><div class="stat"><b>${st.ts.length}</b><span>مهام اليوم</span></div><div class="stat"><b>${st.done}</b><span>منجزة</span></div><div class="stat"><b>${st.pct}%</b><span>نسبة الإنجاز</span><div class="progress"><i style="width:${st.pct}%"></i></div></div><div class="stat"><b>${(st.planned/60).toFixed(1)}</b><span>ساعات مخططة</span></div></div>${warn}<section class="card"><div class="section-title"><h2>☀️ يومك — ${fmtDate(selectedDate)}</h2><div class="date-nav"><button class="secondary small" data-day="-1">‹</button><input type="date" id="selectedDate" value="${selectedDate}"><button class="secondary small" data-day="1">›</button><button class="secondary small" data-today="1">اليوم</button></div></div><div class="muted tiny">اسحب أي مهمة إلى ساعة أخرى لتغيير وقت بدايتها. اضغط «+» داخل الساعة لإضافة مهمة.</div><div class="divider"></div><h3 class="tiny">أهم 3 مهام</h3>${top.length?top.map(t=>`<div class="bar" style="margin:6px 0"><span class="pill red">${PRIOR[t.priority]}</span><span>${esc(t.title)}</span><button class="secondary small" data-action="edit" data-id="${t.id}">فتح</button></div>`).join(''):'<div class="muted tiny">أضف المهام المهمة لليوم.</div>'}<div class="divider"></div><div class="bar"><button data-add="1">＋ مهمة</button><button class="secondary" data-add-at="${selectedDate}|${hm(9*60)}">＋ 09:00</button><button class="secondary" data-view="lists">القوائم والفلاتر</button></div></section><section class="card" style="margin-top:12px"><div class="section-title"><h2>تقويم 24 ساعة</h2><span class="muted tiny">كل خانة ساعة · المهام المتزامنة مسموحة</span></div><div class="hours">${hours}</div></section>${late.length?`<section class="card" style="margin-top:12px"><div class="section-title"><h2>متأخر من أيام سابقة (${late.length})</h2><button data-carry-all="1">انقل الكل لليوم</button></div>${late.slice(0,8).map(t=>taskCard(t)).join('')}${late.length>8?`<div class="muted tiny">و ${late.length-8} مهام أخرى</div>`:''}</section>`:''}`}

function shiftMonth(iso,delta){let d=new Date(iso+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+delta);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderPeriods(){
 const all=activeTasks(); let start=selectedDate,end=selectedDate,title='المهام اليومية';
 if(periodMode==='weekly'){start=addDays(selectedDate,-new Date(selectedDate+'T12:00:00').getDay());end=addDays(start,6);title='المهام الأسبوعية'}
 if(periodMode==='monthly'){start=selectedDate.slice(0,7)+'-01';let d=new Date(start+'T12:00:00');d.setMonth(d.getMonth()+1);end=addDays(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`,-1);title='المهام الشهرية'}
 const ts=all.filter(t=>t.date>=start&&t.date<=end).sort((a,b)=>a.date.localeCompare(b.date)||(+a.start||0)-(+b.start||0));
 const groups={};ts.forEach(t=>(groups[t.date]||(groups[t.date]=[])).push(t));
 const done=doneCount(ts),planned=totalMinutes(ts.filter(t=>t.status!=='done'));
 const label=periodMode==='daily'?fmtDate(start):periodMode==='weekly'?`${fmtDate(start)} — ${fmtDate(end)}`:new Date(start+'T12:00:00').toLocaleDateString('ar-EG',{year:'numeric',month:'long'});
 let content='';
 if(periodMode==='daily'){content=ts.map(taskCard).join('')||'<div class="empty">لا توجد مهام في هذا اليوم. أضف أول مهمة وابدأ التخطيط.</div>'}
 else {let days=[];for(let d=start;d<=end;d=addDays(d,1)){let dayTasks=groups[d]||[];if(periodMode==='weekly'||dayTasks.length)days.push(`<section class="card" style="margin-top:10px"><div class="section-title"><div><h3>${fmtDate(d)}</h3><div class="caption">${dayTasks.length} مهمة · ${pct(dayTasks)}% إنجاز · ${(totalMinutes(dayTasks)/60).toFixed(1)} س مخططة</div></div><button class="secondary small" data-open-date="${d}">افتح اليوم</button></div>${dayTasks.map(taskCard).join('')||'<div class="muted tiny">لا توجد مهام مخططة.</div>'}<button class="secondary small" data-add-at="${d}|09:00">＋ أضف مهمة لهذا اليوم</button></section>`)}content=days.join('')||'<div class="empty">لا توجد مهام في هذه الفترة. أضف مهمة من الزر أدناه.</div>'}
 return `<section class="card"><div class="section-title"><div><h2>تقسيم المهام</h2><div class="caption">افصل التخطيط إلى يومي وأسبوعي وشهري، والأرقام محسوبة من المهام الفعلية.</div></div><button data-add="1">＋ مهمة</button></div><div class="tabs2"><button data-period-mode="daily" class="${periodMode==='daily'?'active':''}">اليومي</button><button data-period-mode="weekly" class="${periodMode==='weekly'?'active':''}">الأسبوعي</button><button data-period-mode="monthly" class="${periodMode==='monthly'?'active':''}">الشهري</button></div><div class="section-title"><h3>${title}</h3><div class="date-nav"><button class="secondary small" data-period-shift="-1">‹</button><span class="tiny">${label}</span><button class="secondary small" data-period-shift="1">›</button><button class="secondary small" data-period-current="1">الفترة الحالية</button></div></div><div class="stats"><div class="stat"><b>${ts.length}</b><span>إجمالي المهام</span></div><div class="stat"><b>${done}</b><span>منجزة</span></div><div class="stat"><b>${pct(ts)}%</b><span>نسبة الإنجاز</span><div class="progress"><i style="width:${pct(ts)}%"></i></div></div><div class="stat"><b>${(planned/60).toFixed(1)}</b><span>ساعات مخططة غير مكتملة</span></div></div><div class="bar"><button class="secondary small" data-add-at="${selectedDate}|09:00">＋ مهمة في ${fmtDate(selectedDate)}</button><button class="secondary small" data-view="today">عرض التقويم بالساعات</button></div></section>${content}`
}
function renderWeek(){let base=addDays(todayISO(),-new Date(todayISO()+'T12:00:00').getDay()+weekShift*7);let boxes='';let weekTasks=[];for(let i=0;i<7;i++){let d=addDays(base,i),st=dayStats(d);weekTasks.push(...st.ts);let main=st.ts.filter(t=>t.status!=='done').sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-({high:0,medium:1,low:2}[b.priority])))[0];boxes+=`<div class="daybox ${d===todayISO()?'today':''}"><h3>${DAYS[i]}</h3><div class="daydate">${fmtDate(d)}</div><div class="tiny" style="margin-top:7px">${st.ts.length} مهمة · ${st.pct}%</div><div class="tiny muted">الأهم: ${main?esc(main.title):'—'}</div>${st.ts.filter(t=>t.status!=='done').slice(0,4).map(t=>`<div class="tiny-task">${hm(t.start)} ${esc(t.title)}</div>`).join('')}<button class="secondary small" style="margin-top:8px;width:100%" data-open-date="${d}">افتح اليوم</button></div>`}let planned=totalMinutes(weekTasks),done=weekTasks.filter(t=>t.status==='done').length;return `<section class="card"><div class="section-title"><h2>الأسبوع</h2><div class="bar"><button class="secondary small" data-week="-1">‹ السابق</button><button class="secondary small" data-week="0">هذا الأسبوع</button><button class="secondary small" data-week="1">التالي ›</button></div></div><div class="stats"><div class="stat"><b>${weekTasks.length}</b><span>إجمالي المهام</span></div><div class="stat"><b>${done}</b><span>منجزة</span></div><div class="stat"><b>${pct(weekTasks)}%</b><span>إنجاز الأسبوع</span></div><div class="stat"><b>${(planned/60).toFixed(1)}</b><span>ساعات مخططة</span></div></div><div class="weekgrid">${boxes}</div></section>`}
function renderLists(){let all=activeTasks();let overdue=all.filter(t=>t.date<todayISO()&&t.status!=='done'),deferred=all.filter(t=>t.status==='deferred'),short=all.filter(t=>t.duration<15&&t.status!=='done'),night=all.filter(t=>(+t.start<300||+t.start>=1320)&&t.status!=='done'),critical=all.filter(t=>t.priority==='high'&&t.date===todayISO()&&t.status!=='done');return `<div class="tabs2"><button class="active" data-listtab="kanban">Kanban</button><button data-listtab="matrix">أيزنهاور</button><button data-listtab="smart">القوائم الذكية</button><button data-listtab="search">بحث وفلاتر</button><button data-listtab="trash">سلة المحذوفات</button></div><div id="listsPanel">${kanban(all)}</div><div class="caption" style="margin-top:8px">تُحسب الأرقام من المهام الفعلية، ولا تُدخل يدويًا.</div>`}
function kanban(all){return `<div class="kanban">${Object.entries(STATUS).map(([s,label])=>`<div class="kanban-col" data-status-col="${s}"><h3>${label} · ${all.filter(t=>t.status===s).length}</h3>${all.filter(t=>t.status===s).map(t=>taskCard(t)).join('')||'<div class="empty tiny">لا توجد مهام</div>'}</div>`).join('')}</div>`}
function matrix(all){let qs=[['q1','مهم وعاجل','high'],['q2','مهم وغير عاجل','medium'],['q3','غير مهم وعاجل','low'],['q4','غير مهم وغير عاجل','low']];return `<div class="matrix">${qs.map(([q,label,p])=>`<div class="quad" data-quad="${q}"><h3>${label}</h3>${all.filter(t=>t.quadrant===q||(!t.quadrant&&((q==='q1'&&t.priority==='high')||(q==='q2'&&t.priority==='medium')||(q==='q3'&&t.priority==='low')))).map(t=>`<div class="tiny" style="margin:6px 0">${esc(t.title)} <button class="ghost small" data-action="edit" data-id="${t.id}">تعديل</button></div>`).join('')||'<div class="muted tiny">اسحب/حرّك المهام عبر التعديل لتحديد الربع.</div>'}<button class="secondary small" data-new-quad="${q}">＋ مهمة هنا</button></div>`).join('')}</div>`}
function renderHabits(){let d=selectedDate,day=new Date(d+'T12:00:00').getDay();let habits=db.habits.filter(h=>!h.days||h.days.includes(day));return `<section class="card"><div class="section-title"><h2>العادات</h2><div class="date-nav"><button class="secondary small" data-day="-1">‹</button><input type="date" id="selectedDate" value="${d}"><button class="secondary small" data-day="1">›</button></div></div><div class="muted tiny">سجّل إنجاز العادة لهذا اليوم. سورة الكهف مهيأة للجمعة.</div><div class="divider"></div>${habits.map(h=>{let logs=db.habitLogs[h.id]||{};let checked=!!logs[d];let streak=0,cur=d;while(logs[cur]){streak++;cur=addDays(cur,-1)}return `<div class="habit"><input type="checkbox" data-habit="${h.id}" ${checked?'checked':''}><div class="habit-name"><strong>${esc(h.name)}</strong><div class="caption">${CAT[h.category]||'شخصي'}</div></div><span class="streak">🔥 ${streak} يوم</span></div>`}).join('')}<div class="divider"></div><button data-add-habit="1">＋ إضافة عادة</button></section><section class="card" style="margin-top:12px"><h3>إحصائيات آخر 7 أيام</h3><div class="stats">${db.habits.slice(0,4).map(h=>{let logs=db.habitLogs[h.id]||{},n=0;for(let i=0;i<7;i++)if(logs[addDays(todayISO(),-i)])n++;return `<div class="stat"><b>${n}/7</b><span>${esc(h.name)}</span></div>`}).join('')}</div></section>`}

function renderEvening(){let ts=tasksOn(selectedDate),done=ts.filter(t=>t.status==='done').length;let r=db.reviews[selectedDate]||{};return `<section class="card"><div class="section-title"><h2>التقفيل المسائي</h2><span class="pill">${fmtDate(selectedDate)}</span></div><div class="stats"><div class="stat"><b>${ts.length}</b><span>مهام اليوم</span></div><div class="stat"><b>${done}</b><span>تم إنجازها</span></div><div class="stat"><b>${ts.length-done}</b><span>باقية</span></div><div class="stat"><b>${pct(ts)}%</b><span>الإنجاز</span></div></div><h3>راجع الحالات</h3>${ts.filter(t=>t.status!=='done').map(t=>taskCard(t)).join('')||'<div class="empty">أحسنت، لا توجد مهام غير منجزة لهذا اليوم.</div>'}<div class="bar"><button id="carryEvening">رحّل كل الباقي إلى غدًا</button><button class="secondary" id="leaveDeferred">علّم الباقي مؤجلًا</button></div><div class="divider"></div><label>ماذا أنجزت؟</label><textarea id="reviewWins" placeholder="ما الذي سار جيدًا؟">${esc(r.wins||'')}</textarea><label style="margin-top:8px">ماذا ضيّعت أو عطّلني؟</label><textarea id="reviewLosses" placeholder="ما الذي أريد تغييره غدًا؟">${esc(r.losses||'')}</textarea><button id="saveEvening" style="margin-top:10px">حفظ التقفيل</button></section>`}
function renderReview(){let base=addDays(todayISO(),-new Date(todayISO()+'T12:00:00').getDay());let week=[];for(let i=0;i<7;i++)week.push(...tasksOn(addDays(base,i)));let cats=Object.keys(CAT).map(c=>({c,m:totalMinutes(week.filter(t=>t.category===c))}));let deferred=activeTasks().filter(t=>t.deferCount).sort((a,b)=>b.deferCount-a.deferCount).slice(0,5);let r=db.reviews[base]||{};return `<section class="card"><div class="section-title"><h2>المراجعة الأسبوعية</h2><span class="pill">من ${fmtDate(base)} إلى ${fmtDate(addDays(base,6))}</span></div><div class="stats"><div class="stat"><b>${week.length}</b><span>المهام</span></div><div class="stat"><b>${pct(week)}%</b><span>الإنجاز</span></div><div class="stat"><b>${(totalMinutes(week)/60).toFixed(1)}</b><span>ساعات مخططة</span></div><div class="stat"><b>${(week.reduce((s,t)=>s+(t.actualMinutes||0),0)/60).toFixed(1)}</b><span>ساعات فعلية</span></div></div><h3>الساعات حسب التصنيف</h3>${cats.map(x=>`<div style="margin:9px 0"><div class="bar" style="justify-content:space-between"><span>${CAT[x.c]}</span><b>${(x.m/60).toFixed(1)} س</b></div><div class="progress"><i style="width:${totalMinutes(week)?x.m/totalMinutes(week)*100:0}%"></i></div></div>`).join('')}<div class="divider"></div><h3>الأكثر تأجيلًا</h3>${deferred.map(t=>`<div class="bar" style="margin:6px 0"><span>${esc(t.title)}</span><span class="pill red">${t.deferCount} مرات</span></div>`).join('')||'<div class="muted tiny">لا توجد تأجيلات مسجلة بعد.</div>'}<div class="divider"></div><label>ما الذي نجح؟</label><textarea id="reviewWeekWins">${esc(r.weekWins||'')}</textarea><label style="margin-top:8px">ما الذي تعطّل؟</label><textarea id="reviewWeekBlockers">${esc(r.weekBlockers||'')}</textarea><h3 style="margin-top:12px">3 أهداف للأسبوع القادم</h3>${[0,1,2].map(i=>`<label>الهدف ${i+1}</label><input id="weekGoal${i}" value="${esc((r.nextGoals||[])[i]||'')}" placeholder="هدف واضح قابل للقياس">`).join('')}<button id="saveWeekly" style="margin-top:12px">حفظ المراجعة</button function showModal(id){document.getElementById('taskModal').classList.add('open');document.getElementById('modalTitle').textContent=id?'تعديل المهمة':'مهمة جديدة';let t=id?db.tasks.find(x=>x.id===id):null;document.getElementById('taskId').value=t?.id||'';document.getElementById('taskTitle').value=t?.title||'';document.getElementById('taskDate').value=t?.date||selectedDate;document.getElementById('taskStart').value=hm(t?.start??540);document.getElementById('taskDuration').value=t?.duration||60;document.getElementById('taskPriority').value=t?.priority||'medium';document.getElementById('taskStatus').value=t?.status||'todo';document.getElementById('taskCategory').value=t?.category||'personal';document.getElementById('taskTags').value=(t?.tags||[]).join(', ');document.getElementById('taskRepeat').value=t?.repeat?.type||'none';document.getElementById('taskRepeatDays').value=(t?.repeat?.days||[]).join(',');document.getElementById('taskGoal').innerHTML='<option value="">بدون هدف</option>'+db.goals.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');document.getElementById('taskGoal').value=t?.goalId||'';document.getElementById('taskActual').value=t?.actualMinutes||0;document.getElementById('taskSubtasks').value=(t?.subtasks||[]).join('\n');document.getElementById('taskNotes').value=t?.notes||'';document.getElementById('repeatDaysField').classList.toggle('hidden',!['custom','weekly'].includes(document.getElementById('taskRepeat').value));setTimeout(()=>document.getElementById('taskTitle').focus(),100)}function hideModal(){document.getElementById('taskModal').classList.remove('open')}
function saveTaskFromForm(e){e.preventDefault();let id=document.getElementById('taskId').value,t=id?db.tasks.find(x=>x.id===id):null;let rep=document.getElementById('taskRepeat').value;let days=document.getElementById('taskRepeatDays').value.split(',').map(x=>parseInt(x.trim(),10)).filter(x=>x>=0&&x<=6);let obj={id:id||uid(),title:document.getElementById('taskTitle').value.trim(),date:document.getElementById('taskDate').value,start:mins(document.getElementById('taskStart').value),duration:Math.max(5,Math.min(1440,+document.getElementById('taskDuration').value||60)),priority:document.getElementById('taskPriority').value,status:document.getElementById('taskStatus').value,category:document.getElementById('taskCategory').value,tags:document.getElementById('taskTags').value.split(',').map(x=>x.trim()).filter(Boolean),subtasks:document.getElementById('taskSubtasks').value.split('\n').map(x=>x.trim()).filter(Boolean),notes:document.getElementById('taskNotes').value.trim(),repeat:rep==='none'?null:{type:rep,days:days.length?days:[new Date(document.getElementById('taskDate').value+'T12:00:00').getDay()]},goalId:document.getElementById('taskGoal').value,actualMinutes:+document.getElementById('taskActual').value||0,deferCount:t?.deferCount||0,createdAt:t?.createdAt||Date.now(),completedAt:document.getElementById('taskStatus').value==='done'?(t?.completedAt||Date.now()):null,deletedAt:null,quadrant:t?.quadrant||'',source:t?.source||'manual'};if(!obj.title){toast('اكتب عنوان المهمة أولًا');return}if(t)Object.assign(t,obj);else db.tasks.push(obj);selectedDate=obj.date;save();hideModal();render();toast(t?'تم تحديث المهمة':'تمت إضافة المهمة')}
function toggleTask(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;t.status=t.status==='done'?'todo':'done';t.completedAt=t.status==='done'?Date.now():null;save();render()}
function deferTask(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;let suggested=addDays(t.date,1);let val=prompt('إلى أي تاريخ تريد التأجيل؟ اكتب غدًا أو بعد غد أو YYYY-MM-DD',suggested);if(val===null)return;val=val.trim();let target=val==='غدًا'||val==='غدا'?addDays(todayISO(),1):val==='بعد غد'||val==='بعد غدًا'?addDays(todayISO(),2):val;if(!/^\d{4}-\d{2}-\d{2}$/.test(target)){toast('اكتب تاريخًا صحيحًا مثل 2026-10-12');return}t.date=target;t.status='deferred';t.deferCount=(t.deferCount||0)+1;selectedDate=target;save();render();if(t.deferCount>=2)toast(`تأجلت «${t.title}» ${t.deferCount} مرة. اختر: تقسيم أو تفويض أو حذف.`,{label:'اختيار حل',fn:()=>{let choice=prompt('اكتب: تقسيم أو تفويض أو حذف');if(choice==='تقسيم'){let sub=prompt('اكتب عنوان المهمة الأصغر');if(sub){t.subtasks=[...(t.subtasks||[]),sub];save();render()}}else if(choice==='تفويض'){let who=prompt('لمن ستفوّض المهمة؟');if(who){t.notes=(t.notes?'\n':'')+'مفوّضة إلى: '+who;save();render()}}else if(choice==='حذف')deleteTask(t.id)}});else toast('تم تأجيل المهمة ونقلها إلى '+fmtDate(target))}
function deleteTask(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;let copy=clone(t);t.deletedAt=Date.now();db.trash.push(copy);save();render();toast('حُذفت المهمة. يمكنك التراجع الآن.',{label:'تراجع',fn:()=>{let live=db.tasks.find(x=>x.id===id);if(live)live.deletedAt=null;db.trash=db.trash.filter(x=>x.id!==id);save();render()}})}function moveToday(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;t.date=selectedDate;t.status=t.status==='done'?'todo':t.status;save();render();toast('نُقلت المهمة إلى '+fmtDate(selectedDate))}function carryAll(){let late=activeTasks().filter(t=>t.date<selectedDate&&t.status!=='done');late.forEach(t=>{t.date=selectedDate;if(t.status==='deferred')t.status='todo'});save();render();toast(`تم نقل ${late.length} مهمة لليوم`)}
function parseQuick(raw){let text=raw.trim(),date=todayISO(),start=mins('09:00'),priority='medium',category='personal';if(/بعد غد/.test(text)){date=addDays(date,2);text=text.replace(/بعد غد(ًا)?/g,'')}else if(/بكره|بكرة|غدا|غدًا/.test(text)){date=addDays(date,1);text=text.replace(/بكره|بكرة|غدا|غدًا/g,'')}else if(/النهارده|اليوم/.test(text)){text=text.replace(/النهارده|اليوم/g,'')}let dateMatch=text.match(/(20\d{2}-\d{2}-\d{2})/);if(dateMatch){date=dateMatch[1];text=text.replace(dateMatch[0],'')}let tm=text.match(/(\d{1,2})(?::(\d{2}))?\s*(ص|صباحًا?|م|مساءً?|am|pm)?/i);if(tm){let h=+tm[1],m=+(tm[2]||0),amp=(tm[3]||'').toLowerCase();if(['م','مساء','مساءً','pm'].includes(amp)&&h<12)h+=12;if(['ص','صباح','صباحًا','am'].includes(amp)&&h===12)h=0;if(h<=23&&m<=59)start=h*60+m;text=text.replace(tm[0],' ')}if(/!عالية|!high|!مهم/.test(text)){priority='high';text=text.replace(/!عالية|!high|!مهم/g,'')}else if(/!منخفضة|!low/.test(text)){priority='low';text=text.replace(/!منخفضة|!low/g,'')}else if(/!متوسطة/.test(text)){priority='medium';text=text.replace(/!متوسطة/g,'')}let tagMatch=[...text.matchAll(/#([\w\u0600-\u06FF]+)/g)].map(m=>m[1]);text=text.replace(/#[\w\u0600-\u06FF]+/g,' ');let catMap={'متجر':'store','محتوى':'content','تعلم':'learning','تعلّم':'learning','عبادة':'worship','صحة':'health','شخصي':'personal'};for(let [k,v] of Object.entries(catMap)){if(tagMatch.includes(k)){category=v;tagMatch=tagMatch.filter(x=>x!==k)}}return {title:text.replace(/\s+/g,' ').trim(),date,start,priority,category,tags:tagMatch,duration:60}}
function addQuick(){let raw=document.getElementById('quickInput').value;if(!raw.trim())return;let p=parseQuick(raw);if(!p.title){toast('لم أستطع فهم عنوان المهمة. اكتب وصفًا بعد الوقت.');return}db.tasks.push({id:uid(),...p,status:'todo',subtasks:[],notes:'',repeat:null,goalId:'',actualMinutes:0,deferCount:0,createdAt:Date.now(),deletedAt:null,source:'quick'});selectedDate=p.date;document.getElementById('quickInput').value='';save();render();toast('تمت إضافة: '+p.title)}
function exportJSON(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'وقتي'},null,2)],{type:'application/json'});download(blob,`waqti-backup-${todayISO()}.json`)}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportICS(){let ts=activeTasks().filter(t=>t.status!=='done');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Waqti//AR','CALSCALE:GREGORIAN'];for(let t of ts){let d=t.date.replace(/-/g,'');let start=+t.start||0,end=start+(+t.duration||60);let dt=(m)=>`${d}T${String(Math.floor(m/60)%24).padStart(2,'0')}${String(m%60).padStart(2,'0')}00`;lines.push('BEGIN:VEVENT',`UID:${t.id}@waqti`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART:${dt(start)}`,`DTEND:${dt(end%1440)}`,`SUMMARY:${String(t.title).replace(/[,;\\]/g,' ')}`,`DESCRIPTION:${String(t.notes||'').replace(/[,;\\]/g,' ')}`,'END:VEVENT')}lines.push('END:VCALENDAR');download(new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),`waqti-${todayISO()}.ics`)}
function importJSON(file){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.tasks)||!Array.isArray(x.habits))throw Error();if(!confirm('سيستبدل الاستيراد بيانات وقتي الحالية. هل صدّرت نسخة احتياطية؟'))return;db=x;save();render();toast('تم استيراد النسخة الاحتياطية')}catch(e){toast('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(file)}

function handleClick(e){
 const b=e.target.closest('button'); if(!b)return;
 const a=b.dataset.action, id=b.dataset.id;
 if(a==='toggle'){toggleTask(id);return}
 if(a==='edit'){showModal(id);return}
 if(a==='defer'){deferTask(id);return}
 if(a==='delete'){deleteTask(id);return}
 if(a==='moveToday'){moveToday(id);return}
 if(b.dataset.view){view=b.dataset.view;render();return}
 if(b.dataset.add){showModal();return}
 if(b.dataset.addAt){const [d,t]=b.dataset.addAt.split('|');showModal();document.getElementById('taskDate').value=d;document.getElementById('taskStart').value=t;return}
 if(b.dataset.day){selectedDate=addDays(selectedDate,+b.dataset.day);render();return}
 if(b.dataset.today){selectedDate=todayISO();render();return}
 if(b.dataset.openDate){selectedDate=b.dataset.openDate;view='today';render();return}
 if(b.dataset.week!==undefined){weekShift=(+b.dataset.week===0)?0:weekShift+(+b.dataset.week);render();return}
 if(b.dataset.periodMode){periodMode=b.dataset.periodMode;render();return}
 if(b.dataset.periodShift){if(periodMode==='daily')selectedDate=addDays(selectedDate,+b.dataset.periodShift);else if(periodMode==='weekly')selectedDate=addDays(selectedDate,7*(+b.dataset.periodShift));else selectedDate=shiftMonth(selectedDate,+b.dataset.periodShift);render();return}
 if(b.dataset.periodCurrent){selectedDate=todayISO();render();return}
 if(b.dataset.carryAll){carryAll();return}
 if(b.dataset.listtab){
  document.querySelectorAll('[data-listtab]').forEach(x=>x.classList.toggle('active',x===b));
  const panel=document.getElementById('listsPanel');
  const which=b.dataset.listtab;
  panel.innerHTML=which==='kanban'?kanban(activeTasks()):which==='matrix'?matrix(activeTasks()):which==='smart'?renderSmart('all'):which==='search'?renderSearch():renderTrash();return;
 }
 if(b.dataset.smart){document.getElementById('listsPanel').innerHTML=renderSmart(b.dataset.smart);return}
 if(b.dataset.newQuad){
  const title=prompt('عنوان المهمة لهذا الربع');if(title){db.tasks.push({id:uid(),title,date:selectedDate,start:540,duration:60,priority:b.dataset.newQuad==='q1'?'high':b.dataset.newQuad==='q2'?'medium':'low',status:'todo',category:'personal',tags:[],subtasks:[],notes:'',repeat:null,goalId:'',actualMinutes:0,deferCount:0,quadrant:b.dataset.newQuad,createdAt:Date.now()});save();render()}return;
 }
 if(b.dataset.addHabit){const name=prompt('اسم العادة');if(name){db.habits.push({id:uid(),name,days:[0,1,2,3,4,5,6],category:catFromText(name)});save();render()}return}
 if(b.id==='themeBtn'||b.id==='toggleTheme'){db.settings.theme=db.settings.theme==='dark'?'light':'dark';save();render();return}
 if(b.id==='closeModal'||b.id==='cancelTask'){hideModal();return}
 if(b.id==='quickAdd'){addQuick();return}
 if(b.id==='exportBtn'||b.id==='exportJSON'){exportJSON();return}
 if(b.id==='exportICS'){exportICS();return}
 if(b.id==='saveSettings'){
  db.settings.dayStart=document.getElementById('dayStart').value;db.settings.sleepStart=document.getElementById('sleepStart').value;db.settings.sleepEnd=document.getElementById('sleepEnd').value;db.settings.availableHours=Math.max(1,Math.min(24,+document.getElementById('availableHours').value||17));
  document.querySelectorAll('[data-prayer]').forEach(x=>{db.settings.prayers[x.dataset.prayer]=x.value});save();render();toast('تم حفظ الإعدادات');return;
 }
 if(b.id==='resetData'){if(confirm('سيتم حذف كل بيانات وقتي وإعادة بيانات البداية. هل أنت متأكد؟')){localStorage.removeItem('waqti-v1');db=initData();render();toast('تمت إعادة ضبط البيانات')}return}
 if(b.id==='saveMission'){db.mission=document.getElementById('mission').value;save();toast('تم حفظ الرسالة');return}
 if(b.dataset.addGoal){const name=prompt('اسم الهدف أو الدور');if(name){db.goals.push({id:uid(),name,role:prompt('الدور المرتبط')||'',mission:prompt('لماذا هذا الهدف؟')||'',target:prompt('نتيجة قابلة للقياس')||''});save();render()}return}
 if(b.dataset.editGoal){const g=db.goals.find(x=>x.id===b.dataset.editGoal);if(g){g.name=prompt('اسم الهدف',g.name)||g.name;g.role=prompt('الدور',g.role)||g.role;g.mission=prompt('الرسالة',g.mission)||g.mission;g.target=prompt('الهدف القابل للقياس',g.target)||g.target;save();render()}return}
 if(b.dataset.deleteGoal){if(confirm('حذف الهدف؟')){db.goals=db.goals.filter(g=>g.id!==b.dataset.deleteGoal);save();render()}return}
 if(b.dataset.linkGoal){const g=db.goals.find(x=>x.id===b.dataset.linkGoal);if(g){const ts=activeTasks().filter(t=>t.goalId===g.id);alert('المهام المرتبطة بـ'+g.name+':\n'+(ts.map(t=>t.title).join('\n')||'لا توجد مهام مرتبطة'))}return}
 if(b.id==='carryEvening'){const ts=tasksOn(selectedDate).filter(t=>t.status!=='done');ts.forEach(t=>{t.date=addDays(selectedDate,1);if(t.status==='deferred')t.status='todo'});save();render();toast(`تم ترحيل ${ts.length} مهمة`);return}
 if(b.id==='leaveDeferred'){tasksOn(selectedDate).filter(t=>t.status!=='done').forEach(t=>{t.status='deferred'});save();render();toast('تم تعليم المهام المتبقية كمؤجلة');return}
 if(b.id==='saveEvening'){db.reviews[selectedDate]={...(db.reviews[selectedDate]||{}),wins:document.getElementById('reviewWins').value,losses:document.getElementById('reviewLosses').value};save();toast('تم حفظ التقفيل المسائي');return}
 if(b.id==='saveWeekly'){const base=addDays(todayISO(),-new Date(todayISO()+'T12:00:00').getDay());db.reviews[base]={...(db.reviews[base]||{}),weekWins:document.getElementById('reviewWeekWins').value,weekBlockers:document.getElementById('reviewWeekBlockers').value,nextGoals:[0,1,2].map(i=>document.getElementById('weekGoal'+i).value)};save();toast('تم حفظ المراجعة الأسبوعية');return}
 if(b.id==='focusStart'){startFocus();return}
 if(b.id==='focusReset'){focus.running=false;clearInterval(focusInterval);focus.remaining=(focus.mode==='work'?(+(document.getElementById('focusWork')?.value||25)):(+(document.getElementById('focusBreak')?.value||5)))*60;focus.total=focus.remaining;render();return}
 if(b.id==='applyFocus'){focus.running=false;clearInterval(focusInterval);focus.mode='work';focus.total=(+document.getElementById('focusWork').value||25)*60;focus.remaining=focus.total;render();return}
 if(b.id==='runFilter'){
  const q=document.getElementById('filterText').value.toLowerCase(),p=document.getElementById('filterPriority').value,s=document.getElementById('filterStatus').value,c=document.getElementById('filterCategory').value,f=document.getElementById('filterFrom').value,to=document.getElementById('filterTo').value;
  const ts=activeTasks().filter(t=>(!q||(t.title+' '+t.notes+' '+(t.tags||[]).join(' ')).toLowerCase().includes(q))&&(!p||t.priority===p)&&(!s||t.status===s)&&(!c||t.category===c)&&(!f||t.date>=f)&&(!to||t.date<=to));document.getElementById('filterResults').innerHTML=`<div class="muted tiny">${ts.length} نتيجة</div>`+ts.map(t=>taskCard(t)).join('');return;
 }
 if(b.id==='emptyTrash'){if(confirm('إفراغ سلة المحذوفات نهائيًا؟')){db.tasks=db.tasks.filter(t=>!t.deletedAt);db.trash=[];save();render()}return}
 if(b.dataset.restore){const t=db.tasks.find(x=>x.id===b.dataset.restore);if(t)t.deletedAt=null;db.trash=db.trash.filter(x=>x.id!==b.dataset.restore);save();render();return}
 if(b.dataset.purge){db.tasks=db.tasks.filter(x=>x.id!==b.dataset.purge);db.trash=db.trash.filter(x=>x.id!==b.dataset.purge);save();render();return}
}
function startFocus(){
 focus.taskId=document.getElementById('focusTask').value;
 if(focus.running){focus.running=false;clearInterval(focusInterval);render();return}
 focus.running=true;focus.last=Date.now();
 focusInterval=setInterval(()=>{
  if(!focus.running)return;
  const now=Date.now(),elapsed=Math.floor((now-focus.last)/1000);
  if(elapsed>0){focus.remaining=Math.max(0,focus.remaining-elapsed);focus.last=now;const c=document.getElementById('focusClock');if(c)c.textContent=String(Math.floor(focus.remaining/60)).padStart(2,'0')+':'+String(focus.remaining%60).padStart(2,'0');
   if(focus.remaining<=0){focus.running=false;clearInterval(focusInterval);
    if(focus.mode==='work'){const t=db.tasks.find(x=>x.id===focus.taskId);if(t)t.actualMinutes=(t.actualMinutes||0)+Math.round(focus.total/60);db.reviews[todayISO()]={...(db.reviews[todayISO()]||{}),focusSessions:(db.reviews[todayISO()]?.focusSessions||0)+1};focus.mode='break';focus.total=(+(document.getElementById('focusBreak')?.value||5))*60;focus.remaining=focus.total;}
    toast('انتهت الجلسة');save();render();
   }
  }
 },1000);render();
}
document.addEventListener('click',handleClick);document.getElementById('taskForm').addEventListener('submit',saveTaskFromForm);document.getElementById('quickInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addQuick()}});document.getElementById('importJSON').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''});document.getElementById('view').addEventListener('change',e=>{if(e.target.id==='selectedDate'){selectedDate=e.target.value||todayISO();render()}else if(e.target.dataset.habit){let h=db.habits.find(x=>x.id===e.target.dataset.habit);if(!db.habitLogs[h.id])db.habitLogs[h.id]={};if(e.target.checked)db.habitLogs[h.id][selectedDate]=true;else delete db.habitLogs[h.id][selectedDate];save();render()}else if(e.target.id==='focusTask')focus.taskId=e.target.value;else if(e.target.id==='taskRepeat'){document.getElementById('repeatDaysField').classList.toggle('hidden',!['custom','weekly'].includes(e.target.value))}});document.getElementById('view').addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag-id]');if(el)e.dataTransfer.setData('text/plain',el.dataset.dragId)});document.getElementById('view').addEventListener('dragover',e=>{let slot=e.target.closest('[data-hour]');if(slot){e.preventDefault();slot.classList.add('drop')}});document.getElementById('view').addEventListener('dragleave',e=>{let slot=e.target.closest('[data-hour]');if(slot)slot.classList.remove('drop')});document.getElementById('view').addEventListener('drop',e=>{let slot=e.target.closest('[data-hour]');if(!slot)return;e.preventDefault();let id=e.dataTransfer.getData('text/plain'),t=db.tasks.find(x=>x.id===id);if(t){t.date=slot.dataset.date;t.start=+slot.dataset.hour*60;selectedDate=t.date;save();render();toast('تم تغيير وقت المهمة')}});document.getElementById('mainNav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render()}});document.getElementById('bottomNav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render()}});
